name: Fetch All Strategies Kite Hybrid (FNO 210 + Indicators + Option Chain)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: auto_trader/requirements.txt
      - name: Install deps
        run: |
          pip install -q kiteconnect pyotp requests pandas openpyxl pytz ta yfinance curl_cffi
          pip install -q -r auto_trader/requirements.txt || true
      - name: Fetch All Strategies (Kite today + yfinance history + NSE chain)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
        run: |
          python -u .github/scripts/fetch_all_strategies_kite.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNO_All_Strategies_KITE
          path: |
            FNO_All_Strategies_KITE.xlsx
            FNO_All_Strategies_KITE.csv
          if-no-files-found: error
          retention-days: 7
      - name: Commit Excel (firewall bypass)
        run: |
          git config user.name "vix-bot"
          git config user.email "vix@users.noreply.github.com"
          git add FNO_All_Strategies_KITE.xlsx FNO_All_Strategies_KITE.csv || true
          git diff --cached --quiet || git commit -m "data: all strategies Kite hybrid $(date +%F) [skip ci]"
          git push origin HEAD
          ls -lh *.xlsx *.csv || true
