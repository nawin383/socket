[kite]
# Kite API credentials
# Get these from https://kite.trade/

api_key = your_api_key_here
access_token = your_access_token_here

[websocket]
# WebSocket connection settings
debug = false
reconnect = true
reconnect_max_tries = 30
reconnect_max_delay = 60
connect_timeout = 30

[instruments]
# Comma-separated list of instrument tokens to subscribe
# Example tokens (replace with actual ones):
# SBIN: 779521
# INFY: 408065
# RELIANCE: 738561
# TCS: 2953217

tokens = 256265,408065,738561

# Default subscription mode: ltp, quote, or full
default_mode = ltp

[logging]
# Logging configuration
level = INFO
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
file = kite_websocket.log
