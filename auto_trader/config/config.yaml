# Kite auto-trader configuration.
# Secrets (API keys, passwords, TOTP secret) live in .env, not here.

mode: paper   # "paper" (simulate fills, no real orders) or "live" (real money). Start in paper.

underlying:
  name: NIFTY
  spot_symbol: "NSE:NIFTY 50"
  spot_instrument_token: 256265
  strike_step: 50

pe_leg:
  enabled: true
  expiry_type: monthly
  target_premium: 700       # entry: pick the ITM PE whose live premium is closest to this
  premium_tolerance: 60
  strike_search_range: 15   # how many strikes away from ATM to search
  quantity_lots: 1
  product: NRML
  close_before_expiry:
    enabled: true
    time: "15:15"           # square off on expiry day at/after this time (IST)
  stop_loss:
    enabled: true
    trigger_pct: 40          # exit if premium rises this % above entry (caps loss at ~40% of credit
                              # received); does NOT re-enter PE for the rest of that day

  take_profit:
    enabled: false
    # Smart profit booking for PE (you have SL control only — this gives you profit control):
    # Trigger when premium drops this % below entry (e.g., 15% profit → 700 → 595)
    # This is "lesser than entry price" logic. Set 0 to disable % check and use points only.
    trigger_pct: 15
    # Absolute points below entry also required (avoid tiny scalps near expiry)
    min_profit_points: 20
    # If true, also require overall day PnL (realized + unrealized of both legs) > 0
    # before booking — implements "based on overall position including closed profits,
    # once PE recovers from loss". If false, books on premium alone.
    require_overall_profit: true
    # After a profit booking, allow a fresh PE entry next trading day (not same day)
    allow_reentry_next_day: true

  reentry_after_stop_loss:
    enabled: true
    discount_points: 20      # after a stop-loss, rest a SELL LIMIT at (SL trigger price - this) on
                              # the same strike — only fills if premium actually comes back down
    order_valid_until: "15:20"  # cancel the resting re-entry order if still unfilled by this time (IST)
                                 # If it fills: this second attempt has its OWN stop at the ORIGINAL
                                 # SL trigger price, capping its max loss at exactly discount_points —
                                 # NOT a repeat of trigger_pct. No third attempt either way.

ce_leg:
  enabled: true
  expiry_type: weekly
  target_premium: 120       # entry: pick the ATM CE whose live premium is closest to this
  premium_tolerance: 15
  strike_search_range: 2    # only 2 strikes from ATM (ATM ±2 = 5 candidates max, matches instruments.py:131 ATM cap)
  quantity_lots: 1
  product: NRML
  exit_premium_threshold: 90   # exit + roll once premium drops below this
  exit_requires_otm: true      # AND the strike must have drifted OTM vs spot
  reentry_moneyness: ATM       # re-enter at the fresh ATM strike after a roll
  avoid_zero_dte_entry: true   # if a fresh/rolled entry would land on an expiring-today (0DTE)
                                # contract, use next week's expiry instead (lower margin/gamma risk)
  min_seconds_between_rolls: 60
  max_rolls_per_day: 15
  close_before_expiry:
    enabled: true
    time: "15:15"

orders:
  entry_order_style: LIMIT
  slippage_buffer_pct: 1.0        # marketable-limit price offset vs LTP
  order_fill_timeout_sec: 20      # wait this long for the limit order, then...
  fallback_to_market: true        # ...cancel and send a MARKET order instead

risk:
  max_daily_loss: 10000           # realized P&L floor (INR); breach -> square off + halt for the day
  kill_switch_file: "STOP_TRADING"  # touch data/STOP_TRADING to pause new entries/rolls instantly
  trading_start: "09:20"
  trading_end: "15:20"
  eod_square_off_time: "15:25"
  # NSE 2026 trading holidays, from the official NSE circular. Excludes
  # holidays that already fall on a weekend (Mahashivratri 15-Feb Sun,
  # Id-Ul-Fitr 21-Mar Sat, Independence Day 15-Aug Sat, Diwali Laxmi Pujan
  # 8-Nov Sun) since those add no extra closure — the weekday check already
  # covers them. Diwali Laxmi Pujan's Muhurat Trading special session
  # (8-Nov, Sunday) is also not listed here for the same reason: it's a
  # brief symbolic session on an already-closed day, not a normal trading
  # day this strategy should treat as one.
  holidays:
    - "2026-01-15"  # Municipal Corporation Election - Maharashtra
    - "2026-01-26"  # Republic Day
    - "2026-03-03"  # Holi
    - "2026-03-26"  # Shri Ram Navami
    - "2026-03-31"  # Shri Mahavir Jayanti
    - "2026-04-03"  # Good Friday
    - "2026-04-14"  # Dr. Baba Saheb Ambedkar Jayanti
    - "2026-05-01"  # Maharashtra Day
    - "2026-05-28"  # Bakri Id
    - "2026-06-26"  # Muharram
    - "2026-09-14"  # Ganesh Chaturthi
    - "2026-10-02"  # Mahatma Gandhi Jayanti
    - "2026-10-20"  # Dussehra
    - "2026-11-10"  # Diwali-Balipratipada
    - "2026-11-24"  # Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"  # Christmas

notifications:
  telegram_enabled: true

health:
  http_port: 8080

polling:
  reconcile_interval_sec: 15
  token_refresh_check_hour: 8     # from this hour onward, re-login once per new day
